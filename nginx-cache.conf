# Paste these location blocks inside your server {} block for zhan.care
# They add long-lived cache headers for Next.js static assets and images.

# Next.js immutable static assets (JS/CSS with content hashes) — 1 year
location /_next/static/ {
    proxy_pass http://localhost:3000;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Images, fonts, icons — 30 days
location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|woff|woff2|ttf)$ {
    proxy_pass http://localhost:3000;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

# Enable Brotli/Gzip compression (add to http {} block)
# gzip on;
# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
# gzip_min_length 1024;
# gzip_comp_level 5;
