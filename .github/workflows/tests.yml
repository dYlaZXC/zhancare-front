name: Tests

# Independent PR gate for zhancareai. Does NOT touch nextjs.yml (the existing
# Pages-deploy workflow) or either backend deploy pipeline (.gitlab-ci.yml /
# .sourcecraft/ci.yaml in zhancare-back) — those remain untouched production
# deploy paths. This workflow spins up a fully ephemeral full stack (isolated
# Postgres + Redis + Django + Next.js production build) purely to run
# Playwright against, and throws all of it away when the job ends.
on:
  pull_request:

env:
  DB_NAME: zhancare_test
  DB_USER: ci
  DB_PASSWORD: ci_local_only
  DB_HOST: localhost
  DB_PORT: 5432
  REDIS_URL: redis://localhost:6379/0
  ENVIRONMENT: development
  DEBUG: "True"
  # Dummy values: settings.py reads these via os.environ[...] at import time
  # (KeyError if unset), but none of the Playwright critical-smoke specs
  # exercise Mistral/Telegram/LiveKit/TipTop/email, so real credentials
  # aren't needed to bring the backend up.
  SECRET_KEY: ci-dummy-secret-key
  MISTRAL_API_KEY: ci-dummy
  TELEGRAM_BOT_TOKEN: ci-dummy
  LIVEKIT_URL: wss://ci-dummy.example
  LIVEKIT_API_KEY: ci-dummy
  LIVEKIT_API_SECRET: ci-dummy
  EMAIL_HOST_USER: ci-dummy@example.com
  EMAIL_HOST_PASSWORD: ci-dummy
  TIPTOP_PUBLIC_ID: ci-dummy
  TIPTOP_API_SECRET: ci-dummy

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:13-3.1
        env:
          POSTGRES_DB: zhancare_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout zhancareai
        uses: actions/checkout@v4

      # zhancare-back lives on GitLab/Sourcecraft, not GitHub, so it can't be
      # pulled with actions/checkout's `repository:` input — clone it
      # directly over SSH using a read-only deploy key.
      # Setup required (see README / PR description for Phase CI-1):
      #   1. Generate a keypair: ssh-keygen -t ed25519 -C "zhancareai-ci" -f ci_deploy_key -N ""
      #   2. Add ci_deploy_key.pub as a *read-only* Deploy Key on the
      #      zhancare-back GitLab project (Settings → Repository → Deploy keys)
      #   3. Add ci_deploy_key (the private key) as a GitHub Actions secret
      #      named BACKEND_DEPLOY_KEY on the zhancareai repo
      - name: Set up SSH for backend checkout
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BACKEND_DEPLOY_KEY }}

      - name: Checkout zhancare-back
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 --branch main git@gitlab.com:adilan.akhramovich/zhancare-back.git ../zhancare-back

      - name: Install GDAL (GeoDjango system dependency)
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ../zhancare-back/requirements.txt

      - name: Install backend dependencies
        working-directory: ../zhancare-back
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate + seed backend test data
        working-directory: ../zhancare-back
        run: |
          python manage.py migrate --noinput
          python manage.py seed_test_data

      - name: Start backend (Django)
        working-directory: ../zhancare-back
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 > /tmp/django.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/ || true)
            if [ "$code" != "000" ]; then echo "backend up ($code)"; exit 0; fi
            sleep 2
          done
          echo "backend failed to start"; cat /tmp/django.log; exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Write CI env for the production build
        run: |
          cat > .env.production.local <<'EOF'
          NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
          NEXT_PUBLIC_API_IMG_URL=http://localhost:8000
          NEXT_PUBLIC_ENABLE_WEBSOCKET=false
          NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
          NEXT_PUBLIC_WSS_URL=ws://localhost:8000/ws
          EOF

      - name: Build frontend
        run: npm run build

      - name: Start frontend (production server)
        run: |
          nohup npm run start > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$code" != "000" ]; then echo "frontend up ($code)"; exit 0; fi
            sleep 2
          done
          echo "frontend failed to start"; cat /tmp/next.log; exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright critical smoke tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
