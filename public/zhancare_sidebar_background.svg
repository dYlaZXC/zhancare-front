    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="724" y2="2172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1FD6FF"/>
      <stop offset="0.18" stop-color="#2978FF"/>
      <stop offset="0.75" stop-color="#1B54FF"/>
      <stop offset="1" stop-color="#48D5FF"/>
    </linearGradient>
    <linearGradient id="wave1" x1="680" y1="150" x2="130" y2="1850" gradientUnits="userSpaceOnUse">
