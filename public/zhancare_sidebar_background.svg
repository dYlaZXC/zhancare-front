<svg width="100%" height="100%" viewBox="0 0 724 2172" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="724" y2="2172" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B2C73"/>
