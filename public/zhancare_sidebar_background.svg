    <path d="M420 -20C553 43 653 128 748 248V-40H420Z" fill="url(#wave1)"/>
    <path d="M420 -20C553 43 653 128 748 248" stroke="#22CFFF" stroke-opacity="0.55" stroke-width="1.5"/>

    <!-- large lower arcs -->
    <path d="M-140 1788C126 1918 461 1829 790 1392L790 1605C481 1961 183 2072 -140 1946V1788Z" fill="url(#wave2)"/>
    <path d="M-120 1810C165 1946 477 1826 787 1443" stroke="#2AA9FF" stroke-opacity="0.42" stroke-width="1.5"/>
    <path d="M-88 1937C187 2083 487 2034 792 1728" stroke="#1C66FF" stroke-opacity="0.35" stroke-width="1.25"/>

