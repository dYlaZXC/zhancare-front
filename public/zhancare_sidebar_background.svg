    <rect x="6" y="6" width="712" height="2160" rx="48" fill="url(#bg)"/>
    <rect x="6" y="6" width="712" height="2160" rx="48" fill="url(#glowTop)"/>
    <rect x="6" y="6" width="712" height="2160" rx="48" fill="url(#glowBottom)"/>

